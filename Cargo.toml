[package]
name = "situation-puzzle-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dev-dependencies]
insta = "1.49.0"
